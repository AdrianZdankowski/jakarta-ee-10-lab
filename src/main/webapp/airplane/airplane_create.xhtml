<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:event type="preRenderView" listener="#{airplaneCreate.init()}" />
    </f:metadata>

    <ui:define name="content">

        <article>
            <header><h2>#{airplaneMessages['airplane.create.title']}</h2></header>

            <h:form styleClass="form">

                <h:panelGrid columns="2" columnClasses="label,value" cellpadding="5">

                    <h:outputLabel for="name" value="#{airplaneMessages['airplane.create.label.name']}"/>
                    <h:inputText id="name" value="#{airplaneCreate.airplane.name}" required="true"/>

                    <h:outputLabel for="year" value="#{airplaneMessages['airplane.create.label.year']}"/>
                    <h:inputText id="year" value="#{airplaneCreate.airplane.yearOfProduction}" required="true"/>

                    <h:outputLabel for="hours" value="#{airplaneMessages['airplane.create.label.hours']}"/>
                    <h:inputText id="hours" value="#{airplaneCreate.airplane.flightHours}" required="true"/>

                    <h:outputLabel for="type" value="#{airplaneMessages['airplane.create.label.type']}"/>
                    <h:selectOneMenu id="type"
                                     value="#{airplaneCreate.airplane.planeType}"
                                     required="true">
                        <f:selectItem itemLabel="#{airplaneMessages['airplane.create.select.placeholder']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{airplaneCreate.planeTypes}"
                                       var="type"
                                       itemLabel="#{type.name}"
                                       itemValue="#{type}"/>
                    </h:selectOneMenu>

                </h:panelGrid>

                <h:panelGroup layout="block" styleClass="form-footer mt-3">
                    <h:commandButton value="#{airplaneMessages['airplane.create.action.save']}"
                                     action="#{airplaneCreate.saveAction}"
                                     styleClass="btn btn-primary"/>
                    <h:button value="#{airplaneMessages['airplane.create.action.cancel']}"
                              outcome="/planetype/planetype_list.xhtml"
                              styleClass="btn btn-secondary ms-2"/>
                </h:panelGroup>

            </h:form>
        </article>
    </ui:define>
</ui:composition>
