<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{airplaneEdit.id}" required="true"/>
        <f:event type="preRenderView" listener="#{airplaneEdit.init}" />
    </f:metadata>

    <ui:define name="content">

        <article>
            <header><h2>#{airplaneMessages['airplane.edit.title']}</h2></header>

            <h:messages globalOnly="true" styleClass="alert alert-danger" showSummary="true" showDetail="true"/>

            <h:form id="editForm" styleClass="form">

                <h:inputHidden value="#{airplaneEdit.airplane.id}"/>

                <h:panelGrid columns="2" columnClasses="label,value" cellpadding="5">

                    <h:outputLabel for="name" value="#{airplaneMessages['airplane.edit.label.name']}"/>
                    <h:panelGroup>
                        <h:inputText id="name"
                                     value="#{airplaneEdit.airplane.name}"
                                     required="true"/>
                        <h:message for="name" styleClass="text-warning d-block mt-1" showSummary="true" showDetail="false"/>
                    </h:panelGroup>

                    <h:outputLabel for="year" value="#{airplaneMessages['airplane.edit.label.year']}"/>
                    <h:panelGroup>
                        <h:inputText id="year"
                                     value="#{airplaneEdit.airplane.yearOfProduction}"
                                     required="true"/>
                        <h:message for="year" styleClass="text-warning d-block mt-1" showSummary="true" showDetail="false"/>
                    </h:panelGroup>

                    <h:outputLabel for="hours" value="#{airplaneMessages['airplane.edit.label.hours']}"/>
                    <h:panelGroup>
                        <h:inputText id="hours"
                                     value="#{airplaneEdit.airplane.flightHours}"
                                     required="true"/>
                        <h:message for="hours" styleClass="text-warning d-block mt-1" showSummary="true" showDetail="false"/>
                    </h:panelGroup>

                    <h:outputLabel for="type" value="#{airplaneMessages['airplane.edit.label.type']}"/>
                    <h:outputText id="type" value="#{airplaneEdit.planeType.name}"/>

                </h:panelGrid>

                <h:panelGroup layout="block" styleClass="form-footer mt-3">
                    <h:commandButton value="#{airplaneMessages['airplane.edit.action.save']}"
                                     action="#{airplaneEdit.saveAction}"
                                     styleClass="btn btn-primary"/>
                    <h:link value="#{airplaneMessages['airplane.edit.action.cancel']}"
                            outcome="/planetype/planetype_view.xhtml"
                            styleClass="btn btn-secondary ms-2">
                        <f:param name="id" value="#{airplaneEdit.planeType.id}" />
                    </h:link>
                </h:panelGroup>

            </h:form>
        </article>
    </ui:define>

</ui:composition>
