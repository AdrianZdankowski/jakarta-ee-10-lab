<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">

        <article class="text--justified">
            <header><h2>#{planetypeMessages['planetype.list.title']}</h2></header>

            <h:panelGroup id="planeTypesTableWrapper">
                <h:dataTable id="planeTypesTable" value="#{planeTypeList.planeTypes.planeTypes}" var="planeType"
                         styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">
                <h:column>
                    <f:facet name="header">#{planetypeMessages['planetype.list.column.name']}</f:facet>
                    <h:outputText value="#{planeType.name}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">#{planetypeMessages['planetype.list.column.view']}</f:facet>
                    <h:link outcome="/planetype/planetype_view.xhtml" value="#{planetypeMessages['planetype.list.action.view']}">
                        <f:param name="id" value="#{planeType.id}"/>
                    </h:link>
                </h:column>

                <h:column rendered="#{request.isUserInRole('admin')}">
                    <f:facet name="header">#{planetypeMessages['planetype.list.column.delete']}</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="#{planetypeMessages['planetype.list.action.delete']}"
                                         actionListener="#{planeTypeList.deleteAction(planeType)}">
                            <f:ajax execute="@this" render="planeTypesTableWrapper"/>      
                        </h:commandButton>
                    </h:form>
                </h:column>

            </h:dataTable>
            </h:panelGroup>
        </article>
    </ui:define>

</ui:composition>
